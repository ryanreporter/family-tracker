<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Tracker — Log In</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #111; --bg: #fff; --muted: #666; --border: #ccc; --bad: #b00020;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #eee; --bg: #111; --muted: #999; --border: #444; --bad: #ff6b6b; }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    form {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    input {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 1rem;
    }
    button {
      background: var(--fg);
      color: var(--bg);
      border: none;
      padding: 10px 12px;
      font-size: 1rem;
      cursor: pointer;
    }
    .error { color: var(--bad); font-size: 0.85rem; margin: 0; }
  </style>
</head>
<body>
  <form method="POST" action="/login">
    <h1>Family Tracker</h1>
    <p class="error" id="error" hidden>Wrong username or password.</p>
    <input type="text" name="username" placeholder="Username" autocomplete="username" required autofocus />
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
    <button type="submit">Log In</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error').hidden = false;
    }
  </script>
</body>
</html>
